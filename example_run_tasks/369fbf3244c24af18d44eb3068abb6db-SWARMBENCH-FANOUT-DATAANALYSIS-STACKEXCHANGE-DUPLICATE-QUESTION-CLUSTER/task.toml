[task]
name = "swarmbench/369fbf3244c24af18d44eb3068abb6db-SWARMBENCH-FANOUT-DATAANALYSIS-STACKEXCHANGE-DUPLICATE-QUESTION-CLUSTER"
description = "Duplicate-question clustering over ~664 REAL Stack Exchange questions (CQADupStack qrels; 12 sub-forums). Group questions whose answers would be the same; topic-only overlap stays apart. Staged label-stripped across 12 community-aligned shards in /input_artifacts/ (~93K tokens). Deterministic pairwise-F1 vs the published duplicate partition; write assignments to /logs/agent/output.json. Offline."

[metadata]
verifier_type = "executable"
domain = "data-analysis"
coordination_pattern = "hierarchical"
human_solving_hours_estimate = 36
human_solving_hours_justification = "Internalise the moderator standard (same underlying question vs same topic but different question): 2h. Read the ~664 real questions across 12 Stack Exchange sub-forums (titles + bodies, code snippets, broken English, varying jargon; ~93K tokens of running text): 6h. The dominant cost is the pairwise duplicate-judgement WITHIN each sub-forum: ~55 questions per forum gives ~1500 candidate pairs per forum, and even after grouping by surface topic the moderator must read each candidate carefully because hard positives have almost no surface overlap (a TeX user asks 'how do I left-align an equation' and another asks 'why does \\\\begin{align*} center mine') and hard negatives are near-identical boilerplate that differ only in one parameter or version - so each candidate needs both questions read in full, summing to 22h across the 12 communities. QA: re-read borderline groups, sanity-check singleton labels, and reconcile the final partition: 6h. Total 36h - duplicate-judgement-dominated over a ~93K-token corpus that a single context cannot pairwise-compare. (The OUTPUT is one group label per question - ~664 entries - assembled by the aligner mostly via concatenation of per-community bundles, since duplicate pairs never cross sub-forums in this corpus.)"
estimated_sub_agents = 13
input_token_estimate = 93500
reference_link = "https://huggingface.co/datasets/mteb/cqadupstack"
why_multi_agent = "Cross-record DUPLICATE DETECTION on long, noisy real Stack Exchange questions is a genuinely interdependent coordination pattern (NOT classify-each-item): a match decision depends on comparing questions to each other, is transitive, and the per-record text is long (avg ~140 words title+body) so per-question read-cost is high. NON-SCRIPTABLE (measured): naive title-string-equality groups score pairwise-F1 ~0.06; tuned token-overlap matching reaches ~0.30; careful semantic matching by a competent reader hits ~0.80-0.95; an all-in-one-group spray scores ~0.001 (precision ~0.0005) and an all-singletons baseline scores 0 (recall 0). The work is the within-community semantic disambiguation, not blocking. THE WEDGE: the 664 questions are staged ONE COMMUNITY PER PART across 12 shards (gaming, stats, programmers, physics, mathematica, unix, webmasters, gis, tex, wordpress, android, english). In the published CQADupStack qrels gold, 100% of duplicate pairs are intra-community - the moderation tag space is per-forum - so the same-question mates are ALWAYS inside one shard. A single agent facing all 664 questions at once (~93K tokens with long bodies + code snippets) cannot pairwise-compare them: it has to skim the bodies and its recall craters because hard positives are detectable only from the body text, not the title. Each bundle worker instead resolves ONE community thoroughly (~55 questions, ~7-9K tokens, ~1500 candidate pairs) and reads bodies fully; the aligner mostly CONCATENATES because cross-community merges are impossible by construction (the gold partition is per-forum), avoiding any global merge-loss path. This is the documented wedge from prior NEWS-CLUSTER and ABT-BUY runs: long per-record text (150-500 words each) burns the single-agent careful-reading budget across hundreds of records, and a single context degrades to title-only skim. Scoring is deterministic pairwise-F1 against the dataset's qrels-derived partition (verify.py invokes no model and no network); it is spray-proof in both directions. verifier_type is executable: tests/verify.py is a FULLY DETERMINISTIC scorer (pairwise-F1 set math over question ids, no LLM call, no network). Per QD-09.5 a fully-deterministic verifier MUST be declared executable, not llm-judge (whose fail-closed contract requires every non-zero reward to come from a parsed LLM verdict). solve.sh is cp-only because the duplicate-cluster reference is the frozen CQADupStack qrels gold - the closed-corpus oracle is copied, not re-derived. Reward is fractional (passed-pair F1), as required for a multi-check verifier. Runs OFFLINE (questions staged label-stripped; tag_forum is real and visible, cluster_id is not staged). Expected multi-vs-single mechanism: single stays precise but recall collapses because the agent cannot read 664 long bodies carefully in one pass; multi reaches both high precision and high recall because each worker reads its 55-question community in full and the aligner concatenates with no risk of cross-forum over-merge. Real data: CQADupStack on HuggingFace (mteb/cqadupstack-* subsets, apache-2.0), derived from the Stack Exchange Data Dump (CC BY-SA 4.0)."

[agent]
timeout_sec = 1200

[verifier]
timeout_sec = 300

[environment]
cpus = 4
memory_mb = 4096
build_timeout_sec = 600
