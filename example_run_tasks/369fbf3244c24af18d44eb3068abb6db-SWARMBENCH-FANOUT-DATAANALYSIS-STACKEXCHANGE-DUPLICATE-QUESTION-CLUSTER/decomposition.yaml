  # ── Final aligner ─────────────────────────────────────────────────────────
  - id: align-question-clusters
    parallel_group: synthesize
    depends_on:
      - group-a-manager
      - group-b-manager
      - group-c-manager
    description: >-
      ALIGNER RULES: DO NOT use the task tool. Execute the work below yourself.

      Read /workspace/bundle_01.json through /workspace/bundle_12.json. Combine
      the per-community groupings into one global duplicate-question partition
      over EVERY question id in the corpus (each id appears exactly once).
      Duplicate-question pairs never span two different sub-forums in the source
      dataset, so do NOT merge groups across bundles — keep each within-community
      group intact with a unique label.

      Write the final object {"analyst_line": "...", "assignments": [{"id":
      "...", "group": "..."}, ...]} to /logs/agent/output.json per instruction.md.
