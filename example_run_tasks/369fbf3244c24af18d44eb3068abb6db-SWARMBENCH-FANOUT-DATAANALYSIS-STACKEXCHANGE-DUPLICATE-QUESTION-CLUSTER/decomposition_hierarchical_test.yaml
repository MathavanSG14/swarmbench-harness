# Hierarchical test decomposition — StackExchange duplicate-question clustering.
#
# Spawn depth contract (config + prompt enforced):
#   Level 0  orchestrator  →  spawns group managers  (subagent_type: "general")
#   Level 1  group manager →  spawns bundle workers  (subagent_type: "explore")
#   Level 2  bundle worker →  NO task tool — explore agents have task:deny in config
#
# Managers: subagent_type "general" — can spawn sub-agents via task tool.
# Workers:  subagent_type "explore" — task tool hard-blocked by opencode.json config;
#           they have Read/Grep/Glob/Bash and execute work directly.

coordination_pattern: hierarchical

sub_tasks:

  # ── Group A manager: parts 01–04 ───────────────────────────────────────────
  - id: group-a-manager
    parallel_group: map
    depends_on: []
    description: >-
      You are the Group A bundle manager. Your ONLY job is to spawn exactly FOUR
      bundle workers using the task tool and collect their results. You MUST use
      the task tool — do not process the files yourself.

      MANAGER RULES:
      - Use subagent_type "explore" for every worker you spawn (leaf agents — task
        tool is disabled for them by config; they use Read/Grep/Glob/Bash directly).
      - Spawn all four workers simultaneously.
      - Wait for all four to return, then report back their status (bundle file
        paths written + any errors). Do NOT write output files yourself.
      - DO NOT do any duplicate-detection work yourself — that is the workers' job.

      Spawn these four workers with subagent_type "explore":

      Worker 1 — part_01.json:
      "Open /input_artifacts/part_01.json. Read instruction.md for the
      duplicate-detection standard. Within ONLY this sub-forum's questions,
      identify which ones ask the same underlying thing (verbatim duplicates,
      rephrasings, follow-ups with the same answer all count) and which are
      distinct — read title AND body together. Emit your within-part groups (each
      group an array of question ids) to /workspace/bundle_01.json."

      Worker 2 — part_02.json:
      "Open /input_artifacts/part_02.json. Apply the same duplicate-detection
      standard as described in instruction.md. Emit within-part groups to
      /workspace/bundle_02.json."

      Worker 3 — part_03.json:
      "Open /input_artifacts/part_03.json. Apply the same duplicate-detection
      standard as described in instruction.md. Emit within-part groups to
      /workspace/bundle_03.json."

      Worker 4 — part_04.json:
      "Open /input_artifacts/part_04.json. Apply the same duplicate-detection
      standard as described in instruction.md. Emit within-part groups to
      /workspace/bundle_04.json."

      After all four workers return, verify bundle_01.json–bundle_04.json exist
      and return a brief status to the orchestrator.

  # ── Group B manager: parts 05–08 ───────────────────────────────────────────
  - id: group-b-manager
    parallel_group: map
    depends_on: []
    description: >-
      You are the Group B bundle manager. Your ONLY job is to spawn exactly FOUR
      bundle workers using the task tool and collect their results. You MUST use
      the task tool — do not process the files yourself.

      MANAGER RULES:
      - Use subagent_type "explore" for every worker you spawn.
      - Spawn all four workers simultaneously.
      - Wait for all four to return, then report back status.
      - DO NOT do any duplicate-detection work yourself.

      Spawn these four workers with subagent_type "explore":

      Worker 1 — part_05.json:
      "Open /input_artifacts/part_05.json. Apply the same duplicate-detection
      standard as described in instruction.md. Emit within-part groups to
      /workspace/bundle_05.json."

      Worker 2 — part_06.json:
      "Open /input_artifacts/part_06.json. Apply the same duplicate-detection
      standard as described in instruction.md. Emit within-part groups to
      /workspace/bundle_06.json."

      Worker 3 — part_07.json:
      "Open /input_artifacts/part_07.json. Apply the same duplicate-detection
      standard as described in instruction.md. Emit within-part groups to
      /workspace/bundle_07.json."

      Worker 4 — part_08.json:
      "Open /input_artifacts/part_08.json. Apply the same duplicate-detection
      standard as described in instruction.md. Emit within-part groups to
      /workspace/bundle_08.json."

      After all four workers return, verify bundle_05.json–bundle_08.json exist
      and return a brief status to the orchestrator.

  # ── Group C manager: parts 09–12 ───────────────────────────────────────────
  - id: group-c-manager
    parallel_group: map
    depends_on: []
    description: >-
      You are the Group C bundle manager. Your ONLY job is to spawn exactly FOUR
      bundle workers using the task tool and collect their results. You MUST use
      the task tool — do not process the files yourself.

      MANAGER RULES:
      - Use subagent_type "explore" for every worker you spawn.
      - Spawn all four workers simultaneously.
      - Wait for all four to return, then report back status.
      - DO NOT do any duplicate-detection work yourself.

      Spawn these four workers with subagent_type "explore":

      Worker 1 — part_09.json:
      "Open /input_artifacts/part_09.json. Apply the same duplicate-detection
      standard as described in instruction.md. Emit within-part groups to
      /workspace/bundle_09.json."

      Worker 2 — part_10.json:
      "Open /input_artifacts/part_10.json. Apply the same duplicate-detection
      standard as described in instruction.md. Emit within-part groups to
      /workspace/bundle_10.json."

      Worker 3 — part_11.json:
      "Open /input_artifacts/part_11.json. Apply the same duplicate-detection
      standard as described in instruction.md. Emit within-part groups to
      /workspace/bundle_11.json."

      Worker 4 — part_12.json:
      "Open /input_artifacts/part_12.json. Apply the same duplicate-detection
      standard as described in instruction.md. Emit within-part groups to
      /workspace/bundle_12.json."

      After all four workers return, verify bundle_09.json–bundle_12.json exist
      and return a brief status to the orchestrator.

  # ── Final aligner ─────────────────────────────────────────────────────────
  - id: align-question-clusters
    parallel_group: synthesize
    depends_on:
      - group-a-manager
      - group-b-manager
      - group-c-manager
    description: >-
      Read /workspace/bundle_01.json through /workspace/bundle_12.json. Combine
      the per-community groupings into one global duplicate-question partition
      over EVERY question id in the corpus (each id appears exactly once).
      Duplicate-question pairs never span two different sub-forums in the source
      dataset, so do NOT merge groups across bundles — keep each within-community
      group intact with a unique label.

      Write the final object {"analyst_line": "...", "assignments": [{"id":
      "...", "group": "..."}, ...]} to /logs/agent/output.json per instruction.md.
