[project]
name = "mascloud-client"
version = "0.1.0"
description = "Trainer CLI for MAS Cloud Run — run SwarmBench tasks in the cloud without ever holding a Fireworks/Daytona key."
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
mascloud = "mascloud_client.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mascloud_client"]